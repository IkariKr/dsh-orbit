# v0.3 Registry deployment example (SOP Stage 6).
#
# This minimal file defines the Hub service only. A containerized gateway
# and machine-ingress sidecar must share the Hub network namespace, as in
# docker-registry/drill.compose.yaml:
#
#   Browser --TLS--> Caddy (shared Hub namespace) --> Hub 127.0.0.1:5445
#   Node A/B --private bridge--> registry-hub:5446 machine-ingress
#                                      --> Hub 127.0.0.1:5445
#
# The Hub binds loopback only. Do not change it to 0.0.0.0, publish 5446 to
# the host, or route /api/v1/* through the browser gateway.
#
# The machine surface is NOT routed by the gateway (see the Caddyfile
# @machine rule): node traffic uses the private listener.

services:
  registry-hub:
    build:
      context: ..
      dockerfile: docker-registry/Dockerfile
    # Bind this explicitly to an RC or release image tag (for example,
    # v0.3.0-rc.1). The Stage 6 construction tag v0.3.0-s6 is never a
    # default and must not be used for deployment.
    image: dsh-orbit-registry:${DSH_ORBIT_REGISTRY_TAG:?set DSH_ORBIT_REGISTRY_TAG}
    environment:
      DSH_ORBIT_HUB_GATEWAY_SECRET: ${DSH_ORBIT_HUB_GATEWAY_SECRET:?set in .env}
      DSH_ORBIT_HUB_OPERATOR_PRINCIPAL: ${DSH_ORBIT_HUB_OPERATOR_PRINCIPAL:-operator}
      DSH_ORBIT_HUB_TRUSTED_SCHEME: https
    volumes:
      - ../data/orbit:/data/orbit:rw
    ports:
      # Private backend listener only: host loopback, never a public
      # interface. A containerized gateway sharing this Hub network
      # namespace reaches the same loopback listener.
      - "127.0.0.1:${DSH_ORBIT_HUB_PORT:-5445}:5445"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://127.0.0.1:5445/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# The gateway (Caddy) terminates TLS and routes ONLY the browser
# surface. Deploy it with network_mode: service:registry-hub (or an
# equivalent shared network namespace) so it can reach 127.0.0.1:5445.
# Machine routes are refused at the gateway (403); a private
# machine-ingress sidecar handles Node traffic on the compose network.
