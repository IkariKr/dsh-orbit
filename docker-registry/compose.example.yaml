# v0.3 Registry deployment example (SOP Stage 6, Gate B closure).
#
# Topology:
#   Operator browser --TLS--> Gateway (Caddy) --loopback--> Hub :5445
#   Node A/B (DSH) -------private machine path--------> Hub :5445
#
# The Hub container publishes ONLY to the host loopback
# ("127.0.0.1:5445:5445"); nothing is on a public interface. The
# gateway runs on the HOST (or with network_mode: host) so it reaches
# the hub through that same loopback — the hub's frozen listener
# policy (loopback-only, plain-HTTP private backend) is never relaxed.
#
# The machine surface is NOT routed by the gateway (see the
# Caddyfile @machine rule): node traffic uses the private listener.

services:
  registry-hub:
    build:
      context: ..
      dockerfile: docker-registry/Dockerfile
    image: dsh-orbit-registry:${DSH_ORBIT_REGISTRY_TAG:-v0.3.0-s6}
    environment:
      DSH_ORBIT_HUB_GATEWAY_SECRET: ${DSH_ORBIT_HUB_GATEWAY_SECRET:?set in .env}
      DSH_ORBIT_HUB_OPERATOR_PRINCIPAL: ${DSH_ORBIT_HUB_OPERATOR_PRINCIPAL:-operator}
      DSH_ORBIT_HUB_TRUSTED_SCHEME: https
    volumes:
      - ../data/orbit:/data/orbit:rw
    ports:
      # Private backend listener only: host loopback, never a public
      # interface. The gateway (host/network_mode:host) connects here.
      - "127.0.0.1:${DSH_ORBIT_HUB_PORT:-5445}:5445"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://127.0.0.1:5445/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# The gateway (Caddy) terminates TLS and routes ONLY the browser
# surface; deploy it with network_mode: host (Linux) so it can reach
# 127.0.0.1:5445. Machine routes are refused at the gateway (403).