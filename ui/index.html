<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Orbit Registry</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>DSH Orbit Registry</h1>
    <div id="session-status" class="session-status">connecting&hellip;</div>
  </header>

  <nav>
    <button id="nav-nodes" class="nav-button active" type="button">Nodes</button>
    <button id="nav-tokens" class="nav-button" type="button">Tokens</button>
    <button id="nav-fleet" class="nav-button" type="button">Fleet Workflows</button>
    <button id="nav-schedules" class="nav-button" type="button">Scheduled Workflows</button>
    <button id="nav-logout" class="nav-button" type="button">Logout</button>
  </nav>

  <main id="main">
    <div id="state-banner"></div>
    <section id="nodes-view">
      <div id="nodes-list"></div>
      <div id="reenroll-result"></div>
      <div id="node-detail-view" hidden></div>
    </section>
    <section id="tokens-view" hidden>
      <div class="panel">
        <button id="mint-token" class="primary" type="button">Mint enrollment token</button>
        <div id="mint-result"></div>
        <button id="mint-pair-token" class="primary" type="button">Mint pairing token</button>
        <div id="pair-mint-result"></div>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>tokenId</th><th>purpose</th><th>bound node</th><th>status</th><th>created</th><th>expires</th><th>consumed</th></tr></thead>
          <tbody id="token-table-body"></tbody>
        </table>
      </div>
    </section>
    <section id="fleet-view" hidden>
      <div class="panel fleet-actions-panel">
        <button id="trigger-fleet-job-btn" class="primary" type="button">Trigger Fleet Job</button>
        <button id="refresh-fleet-jobs-btn" class="secondary" type="button">Refresh Jobs</button>
      </div>
      <div id="fleet-jobs-list"></div>
      <div id="fleet-job-detail-view" hidden></div>
    </section>
    <section id="schedules-view" hidden>
      <div class="panel fleet-actions-panel">
        <button id="create-schedule-btn" class="primary" type="button">Create Schedule</button>
        <button id="refresh-schedules-btn" class="secondary" type="button">Refresh Schedules</button>
      </div>
      <div id="schedules-list"></div>
    </section>
  </main>

  <dialog id="schedule-dialog">
    <h3>Create Scheduled Workflow</h3>
    <div style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
      <label>Schedule Name
        <input id="schedule-name" type="text" placeholder="Nightly Diagnostic" required>
      </label>
      <label>Schedule Type
        <select id="schedule-type">
          <option value="cron">Cron Expression</option>
          <option value="interval">Interval (ms)</option>
        </select>
      </label>
      <div id="schedule-cron-group">
        <label>Cron Expression (5-field UTC)
          <input id="schedule-cron" type="text" value="0 2 * * *">
        </label>
      </div>
      <div id="schedule-interval-group" style="display:none;">
        <label>Interval (ms)
          <input id="schedule-interval" type="number" value="60000" min="1000">
        </label>
      </div>
      <label>Task Type
        <input id="schedule-task-type" type="text" value="diagnostic" required>
      </label>
      <label>Target Mode
        <select id="schedule-target-mode">
          <option value="explicit">Explicit Node IDs</option>
          <option value="capability">Capability Matching</option>
        </select>
      </label>
      <div id="schedule-explicit-group">
        <label>Node IDs (comma-separated 32-hex)
          <input id="schedule-target-nodes" type="text" placeholder="node_..., node_...">
        </label>
      </div>
      <div id="schedule-capability-group" style="display:none;">
        <label>Required Capability
          <input id="schedule-target-capability" type="text" placeholder="web.routes">
        </label>
      </div>
      <label>Concurrency Policy
        <select id="schedule-concurrency">
          <option value="forbid">Forbid Overlap</option>
          <option value="allow">Allow Overlap</option>
        </select>
      </label>
      <div id="schedule-error" class="banner error" style="display:none;"></div>
      <div class="dialog-actions">
        <button id="schedule-cancel" type="button">Cancel</button>
        <button id="schedule-submit" class="primary" type="button">Save Schedule</button>
      </div>
    </div>
  </dialog>

  <dialog id="fleet-job-dialog">
    <h3>Trigger Fleet Job</h3>
    <div style="display:flex; flex-direction:column; gap:12px; min-width:320px;">
      <label>Task Type
        <input id="fleet-job-task-type" type="text" value="diagnostic" required>
      </label>
      <label>Target Mode
        <select id="fleet-job-target-mode">
          <option value="explicit">Explicit Node IDs</option>
          <option value="capability">Capability Matching</option>
        </select>
      </label>
      <div id="fleet-job-explicit-group">
        <label>Node IDs (comma-separated 32-hex)
          <input id="fleet-job-target-nodes" type="text" placeholder="node_..., node_...">
        </label>
      </div>
      <div id="fleet-job-capability-group" style="display:none;">
        <label>Required Capability
          <input id="fleet-job-target-capability" type="text" placeholder="web.routes">
        </label>
      </div>
      <label>Timeout (ms)
        <input id="fleet-job-timeout" type="number" value="30000" min="1000" max="300000">
      </label>
      <label>Payload (JSON optional)
        <textarea id="fleet-job-payload" rows="3" placeholder='{"action":"healthcheck"}'></textarea>
      </label>
      <div id="fleet-job-error" class="banner error" style="display:none;"></div>
      <div class="dialog-actions">
        <button id="fleet-job-cancel" type="button">Cancel</button>
        <button id="fleet-job-submit" class="primary" type="button">Dispatch Job</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <p id="confirm-dialog-message"></p>
    <label>Retirement reason <input id="confirm-reason" type="text" required maxlength="200"></label>
    <div class="dialog-actions">
      <button id="confirm-cancel" type="button">Cancel</button>
      <button id="confirm-ok" type="button">Delete node</button>
    </div>
  </dialog>

  <script type="module" src="/app.mjs"></script>
</body>
</html>
