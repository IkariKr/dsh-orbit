server {
  listen 443 ssl http2;
  server_name dsh.example.com;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location / {
    proxy_pass https://127.0.0.1:18443;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name dsh.example.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # A local/LAN proxy must not forward a client-supplied Access assertion.
    # Only the dedicated identity-aware access path may present that header to Caddy.
    proxy_set_header Cf-Access-Jwt-Assertion "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
